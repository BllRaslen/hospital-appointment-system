spring:
  application:
    name: randevu-sistemi

  # Baglanti bilgileri ortam degiskenlerinden okunur (varsayilanlar yerel
  # gelistirme icindir); sifre gibi gizli bilgiler asla dogrudan buraya
  # yazilmaz.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/randevu_db}
    username: ${DB_USERNAME:randevu_user}
    password: ${DB_PASSWORD:randevu_pass}

  jpa:
    # "update": gelistirme asamasinda, henuz ayri bir migration araci
    # (Flyway/Liquibase) eklenmedigi icin Hibernate semayi entity
    # eslemelerinden kendisi olusturur/gunceller. Bu, PRODUCTION icin
    # ONERILMEZ (veri kaybina yol acabilecek otomatik degisiklikler
    # yapabilir) — bir migration araci eklendiginde "validate" moduna
    # gecilecek ve sema degisiklikleri ayri, denetlenebilir script'lerle
    # yonetilecektir.
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080
